name: Deploy Cockpit to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Integrity & Security Gatekeeper Suite
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Static Site Bundle
        run: |
          mkdir -p _site/assets _site/docs _site/data
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -r assets/* _site/assets/
          cp -r docs/*.md _site/docs/
          cp data/verified_v2_manifest.json _site/data/verified_v2_manifest.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
